# Base44 development compose for LibreChat
# Runs the API (nodemon, port 3080) and client (Vite dev, port 3000) from source.
services:
  mongodb:
    image: mongo:8.0
    restart: on-failure
    command: mongod --noauth
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  meilisearch:
    image: getmeili/meilisearch:v1.12.3
    restart: on-failure
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=DrhYf7zENyR6AlUCKmnz0eYASOQdl6zxH7s7MKFSfFCt
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: node:20
    restart: on-failure
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - DOMAIN_CLIENT=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - DOMAIN_SERVER=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command:
      - sh
      - -ec
      - |
        npm ci --no-audit --fetch-retries=5 --fetch-retry-maxtimeout=600000
        npm run build:packages
        mkdir -p client/dist && echo '<!DOCTYPE html><html><head><title>LibreChat</title></head><body><div id="root"></div></body></html>' > client/dist/index.html
        PORT=3080 HOST=0.0.0.0 npm run backend:dev &
        export PORT=3000 BACKEND_PORT=3080
        exec npm run frontend:dev
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:3000/ >/dev/null && curl -sf http://localhost:3080/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 300s

volumes:
  mongo_data:
  meili_data:
  node_modules:
